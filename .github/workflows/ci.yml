name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'namespace-profile-default' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Agent guide checks
        run: pnpm test

      - name: Preserve versioned guides
        env:
          GUIDE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-agent-guide-history.mjs "$GUIDE_BASE"

      - name: Type check
        run: pnpm astro check

      - name: Build
        run: pnpm build

      - name: Build without Git metadata
        run: node scripts/smoke-gitless-build.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        run: pnpm test:browser

      - name: Snapshot packaging tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Package documentation snapshot
        run: pnpm package:snapshot

      - name: Upload documentation snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-snapshot-${{ github.sha }}
          path: dist/docs-artifact/
          if-no-files-found: error

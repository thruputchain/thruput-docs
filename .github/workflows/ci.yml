name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: namespace-profile-default
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Agent guide checks
        run: pnpm test

      - name: Preserve versioned guides
        env:
          GUIDE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-agent-guide-history.mjs "$GUIDE_BASE"

      - name: Type check
        run: pnpm astro check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        run: pnpm test:browser

      - name: Snapshot packaging tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Package documentation snapshot
        run: pnpm package:snapshot

      - name: Upload documentation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: docs-snapshot-${{ github.sha }}
          path: dist/docs-artifact/
          if-no-files-found: error
